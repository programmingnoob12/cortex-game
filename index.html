<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cortex-game</title>
    <!-- Today's opening-edit song, fetched while the app's code is still
         loading, and only on the day's first visit (when the edit plays).
         Must match SS_TRACKS and the day rotation in src/App.jsx. -->
    <script>
      try {
        var d = new Date();
        if (localStorage.getItem("cortex.editDay") !== d.toDateString()) {
          var songs = ["/audio/emotionless-edit-v6.mp3"];
          var l = document.createElement("link");
          l.rel = "preload"; l.as = "fetch"; l.type = "audio/mpeg"; l.crossOrigin = "anonymous";
          l.href = songs[Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000) % songs.length];
          document.head.appendChild(l);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
