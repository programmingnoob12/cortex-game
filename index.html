<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Not launched. Keeps the app out of search results until it is.
         Remove both this and public/robots.txt to go public. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Cortex</title>
    <style>
      /* Painted before the bundle loads, so the first frame is the app's own
         background rather than a white page that reads as a broken load. */
      html,
      body,
      #root {
        margin: 0;
        background-color: #08090a;
        color: #f7f8f8;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
